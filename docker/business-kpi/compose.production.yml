name: business-kpi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BUSINESS_KPI_DB_USER:?required}
      POSTGRES_PASSWORD: ${BUSINESS_KPI_DB_PASSWORD:?required}
      POSTGRES_DB: ${BUSINESS_KPI_DB_NAME:-business_kpi}
    volumes:
      - business_kpi_postgres_data:/var/lib/postgresql/data
      - ./postgres-init/001-business-kpi-role.sql:/docker-entrypoint-initdb.d/001-business-kpi-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - business_kpi_internal

  migrate:
    build:
      context: ../..
      dockerfile: docker/business-kpi/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BUSINESS_KPI_STORAGE_MODE: postgresql
      BUSINESS_KPI_DATABASE_URL: postgresql://${BUSINESS_KPI_DB_USER}:${BUSINESS_KPI_DB_PASSWORD}@postgres:5432/${BUSINESS_KPI_DB_NAME:-business_kpi}
    command: ["node", "apps/business-kpi-web/storage/run-migrations.js"]
    networks:
      - business_kpi_internal

  bootstrap-users:
    build:
      context: ../..
      dockerfile: docker/business-kpi/Dockerfile
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      BUSINESS_KPI_STORAGE_MODE: postgresql
      BUSINESS_KPI_DATABASE_URL: postgresql://${BUSINESS_KPI_DB_USER}:${BUSINESS_KPI_DB_PASSWORD}@postgres:5432/${BUSINESS_KPI_DB_NAME:-business_kpi}
      BUSINESS_KPI_OWNER_LOGIN: ${BUSINESS_KPI_OWNER_LOGIN:-kushchev}
      BUSINESS_KPI_OWNER_PASSWORD: ${BUSINESS_KPI_OWNER_PASSWORD:-}
      BUSINESS_KPI_AMPER_LOGIN: ${BUSINESS_KPI_AMPER_LOGIN:-amper}
      BUSINESS_KPI_AMPER_PASSWORD: ${BUSINESS_KPI_AMPER_PASSWORD:-}
      BUSINESS_KPI_VENTIL_LOGIN: ${BUSINESS_KPI_VENTIL_LOGIN:-ventil}
      BUSINESS_KPI_VENTIL_PASSWORD: ${BUSINESS_KPI_VENTIL_PASSWORD:-}
    command: ["node", "scripts/business-kpi-bootstrap-users.js"]
    networks:
      - business_kpi_internal

  web:
    build:
      context: ../..
      dockerfile: docker/business-kpi/Dockerfile
    restart: unless-stopped
    depends_on:
      bootstrap-users:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      BUSINESS_KPI_STORAGE_MODE: postgresql
      BUSINESS_KPI_DATABASE_URL: postgresql://${BUSINESS_KPI_DB_USER}:${BUSINESS_KPI_DB_PASSWORD}@postgres:5432/${BUSINESS_KPI_DB_NAME:-business_kpi}
      BUSINESS_KPI_DEV_MODE: "false"
      BUSINESS_KPI_SEED_REFERENCE_DATA: "false"
      BUSINESS_KPI_HTTP_HOST: 0.0.0.0
      BUSINESS_KPI_HTTP_PORT: 3220
      BUSINESS_KPI_COOKIE_SECURE: ${BUSINESS_KPI_COOKIE_SECURE:-false}
      BUSINESS_KPI_SERVICE_KEYS: ${BUSINESS_KPI_SERVICE_KEYS:-[]}
    ports:
      - "127.0.0.1:${BUSINESS_KPI_WEB_PORT:-3220}:3220"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3220/health').then(async r=>{const b=await r.json();if(!r.ok||b.data?.storage?.healthy!==true)process.exit(1)}).catch(()=>process.exit(1))"]
    networks:
      business_kpi_internal: {}
      business_kpi_edge: {}
      arthur_services:
        aliases:
          - business-kpi-api

networks:
  business_kpi_internal:
    name: business_kpi_internal
    internal: true
  business_kpi_edge:
    name: business_kpi_edge
  arthur_services:
    name: ${ARTHUR_SERVICES_NETWORK:-arthur_services}
    external: true

volumes:
  business_kpi_postgres_data:
    name: business_kpi_postgres_data
