services:
  minmax-direct-mail-intake:
    build:
      context: ../..
      dockerfile: docker/minmax-direct-mail-intake/Dockerfile
    container_name: minmax-direct-mail-intake
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MINMAX_BUILD_SHA: ${MINMAX_BUILD_SHA:?MINMAX_BUILD_SHA is required}
      MINMAX_ALLOWED_SENDER: ${MINMAX_ALLOWED_SENDER:?MINMAX_ALLOWED_SENDER is required}
      MINMAX_SUBJECT_PATTERN: ${MINMAX_SUBJECT_PATTERN:?MINMAX_SUBJECT_PATTERN is required}
      MINMAX_IMAP_HOST: ${MINMAX_IMAP_HOST:-imap.yandex.ru}
      MINMAX_IMAP_PORT: ${MINMAX_IMAP_PORT:-993}
      MINMAX_IMAP_USER: ${MINMAX_IMAP_USER:?MINMAX_IMAP_USER is required}
      MINMAX_IMAP_PASSWORD: ${MINMAX_IMAP_PASSWORD:?MINMAX_IMAP_PASSWORD is required}
      MINMAX_IMAP_MAILBOX: ${MINMAX_IMAP_MAILBOX:-INBOX}
      MINMAX_SMTP_HOST: ${MINMAX_SMTP_HOST:-smtp.yandex.ru}
      MINMAX_SMTP_PORT: ${MINMAX_SMTP_PORT:-465}
      MINMAX_SMTP_USER: ${MINMAX_SMTP_USER:?MINMAX_SMTP_USER is required}
      MINMAX_SMTP_PASSWORD: ${MINMAX_SMTP_PASSWORD:?MINMAX_SMTP_PASSWORD is required}
      MINMAX_SMTP_FROM: ${MINMAX_SMTP_FROM:?MINMAX_SMTP_FROM is required}
      MINMAX_NOTIFY_EMAIL: ${MINMAX_NOTIFY_EMAIL:?MINMAX_NOTIFY_EMAIL is required}
      MINMAX_PURCHASING_API_BASE_URL: ${MINMAX_PURCHASING_API_BASE_URL:-http://host.docker.internal:3210}
      PURCHASING_API_TOKEN: ${PURCHASING_API_TOKEN:?PURCHASING_API_TOKEN is required}
      MINMAX_OWNER_UI_BASE_URL: ${MINMAX_OWNER_UI_BASE_URL:?MINMAX_OWNER_UI_BASE_URL is required}
      MINMAX_MAX_ATTACHMENT_BYTES: ${MINMAX_MAX_ATTACHMENT_BYTES:-20971520}
      MINMAX_POLL_INTERVAL_MS: ${MINMAX_POLL_INTERVAL_MS:-10000}
      MINMAX_RUN_POLL_INTERVAL_MS: ${MINMAX_RUN_POLL_INTERVAL_MS:-5000}
      MINMAX_RUN_POLL_TIMEOUT_MS: ${MINMAX_RUN_POLL_TIMEOUT_MS:-600000}
    ports:
      - "127.0.0.1:3220:3220"
