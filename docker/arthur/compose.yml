name: arthur-core

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthur
      POSTGRES_PASSWORD: ${ARTHUR_POSTGRES_PASSWORD:?ARTHUR_POSTGRES_PASSWORD is required}
      POSTGRES_DB: arthur
    volumes:
      - arthur_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthur -d arthur"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - arthur_internal

  migrate:
    build:
      context: ../..
      dockerfile: docker/arthur/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ARTHUR_DATABASE_URL: postgresql://arthur:${ARTHUR_POSTGRES_PASSWORD:?ARTHUR_POSTGRES_PASSWORD is required}@postgres:5432/arthur
    command:
      - node
      - scripts/arthur/run-migrations.js
    networks:
      - arthur_internal

  api:
    build:
      context: ../..
      dockerfile: docker/arthur/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ARTHUR_ALLOW_PRODUCTION: "true"
      ARTHUR_DATABASE_URL: postgresql://arthur:${ARTHUR_POSTGRES_PASSWORD:?ARTHUR_POSTGRES_PASSWORD is required}@postgres:5432/arthur
      ARTHUR_API_TOKEN: ${ARTHUR_API_TOKEN:?ARTHUR_API_TOKEN is required}
      ARTHUR_HTTP_HOST: 0.0.0.0
      ARTHUR_HTTP_PORT: 8787
      ARTHUR_AI_PROVIDER: ${ARTHUR_AI_PROVIDER:-fake}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_FAST_MODEL: ${OMNIROUTE_FAST_MODEL:-arthur-fast}
      OMNIROUTE_REASONING_MODEL: ${OMNIROUTE_REASONING_MODEL:-arthur-fast}
      OMNIROUTE_CODE_MODEL: ${OMNIROUTE_CODE_MODEL:-arthur-fast}
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      arthur_internal: {}
      arthur_n8n:
        aliases:
          - arthur-api

  telegram-gateway:
    build:
      context: ../..
      dockerfile: docker/arthur/Dockerfile.telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?TELEGRAM_ALLOWED_USER_IDS is required}
      ARTHUR_OWNER_PROFILE_ID: ${ARTHUR_OWNER_PROFILE_ID:?ARTHUR_OWNER_PROFILE_ID is required}
      TELEGRAM_POLL_TIMEOUT_MS: ${TELEGRAM_POLL_TIMEOUT_MS:-30000}
      TELEGRAM_API_TIMEOUT_MS: ${TELEGRAM_API_TIMEOUT_MS:-10000}
      TELEGRAM_API_RETRY_ATTEMPTS: ${TELEGRAM_API_RETRY_ATTEMPTS:-3}
      TELEGRAM_GATEWAY_HEALTH_PORT: ${TELEGRAM_GATEWAY_HEALTH_PORT:-8788}
      TELEGRAM_GATEWAY_LOG_LEVEL: ${TELEGRAM_GATEWAY_LOG_LEVEL:-info}
      PURCHASING_RUNS_ROOT: ${PURCHASING_RUNS_ROOT:-/opt/arthur/output/purchasing-web/runs}
    ports:
      - "127.0.0.1:${TELEGRAM_GATEWAY_HEALTH_PORT:-8788}:${TELEGRAM_GATEWAY_HEALTH_PORT:-8788}"
    volumes:
      - ../../output/purchasing-web/runs:/opt/arthur/output/purchasing-web/runs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${TELEGRAM_GATEWAY_HEALTH_PORT:-8788}/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - arthur_internal
      - arthur_outbound

networks:
  arthur_internal:
    internal: true
  arthur_n8n:
    name: ${ARTHUR_N8N_NETWORK:-arthur_n8n}
  arthur_outbound:
    driver: bridge

volumes:
  arthur_postgres_data:
