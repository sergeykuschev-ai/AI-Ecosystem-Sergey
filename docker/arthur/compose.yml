name: arthur-core

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthur
      POSTGRES_PASSWORD: ${ARTHUR_POSTGRES_PASSWORD:?ARTHUR_POSTGRES_PASSWORD is required}
      POSTGRES_DB: arthur
    volumes:
      - arthur_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthur -d arthur"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - arthur_internal

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${ARTHUR_POSTGRES_PASSWORD:?ARTHUR_POSTGRES_PASSWORD is required}
    volumes:
      - ../../data/arthur/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        for file in /migrations/*.up.sql; do
          echo "Applying $${file}"
          psql -h postgres -U arthur -d arthur -v ON_ERROR_STOP=1 -f "$${file}"
        done
    networks:
      - arthur_internal

  api:
    build:
      context: ../..
      dockerfile: docker/arthur/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      ARTHUR_ALLOW_PRODUCTION: "true"
      ARTHUR_DATABASE_URL: postgresql://arthur:${ARTHUR_POSTGRES_PASSWORD:?ARTHUR_POSTGRES_PASSWORD is required}@postgres:5432/arthur
      ARTHUR_API_TOKEN: ${ARTHUR_API_TOKEN:?ARTHUR_API_TOKEN is required}
      ARTHUR_HTTP_HOST: 0.0.0.0
      ARTHUR_HTTP_PORT: 8787
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - arthur_internal
      - arthur_n8n

networks:
  arthur_internal:
    internal: true
  arthur_n8n:
    name: ${ARTHUR_N8N_NETWORK:-arthur_n8n}

volumes:
  arthur_postgres_data:
