name: Arthur Core CI

on:
  pull_request:
    paths:
      - 'agents/arthur-core/**'
      - 'agents/arthur-v1/**'
      - 'data/arthur/**'
      - 'docker/arthur/**'
      - 'n8n/workflows/**'
      - 'scripts/arthur/**'
      - 'package.json'
      - '.github/workflows/arthur-core-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arthur
          POSTGRES_PASSWORD: arthur
          POSTGRES_DB: arthur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U arthur -d arthur_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      ARTHUR_DATABASE_URL: postgresql://arthur:arthur@localhost:5432/arthur_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix agents/arthur-core --ignore-scripts --no-audit --no-fund

      - name: Validate n8n workflow
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'n8n/workflows/arthur-create-task-webhook.json';
          const workflow = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!workflow.name || !Array.isArray(workflow.nodes) || workflow.nodes.length !== 4) {
            throw new Error('Invalid Arthur n8n workflow structure');
          }
          const requestNode = workflow.nodes.find(node => node.type === 'n8n-nodes-base.httpRequest');
          if (!requestNode || requestNode.parameters.url !== 'http://arthur-api:8787/v1/tasks') {
            throw new Error('Arthur Core URL is missing from n8n workflow');
          }
          const serialized = JSON.stringify(workflow);
          if (!serialized.includes('$env.ARTHUR_API_TOKEN')) {
            throw new Error('n8n workflow must read token from environment');
          }
          if (!serialized.includes('sourceType')) {
            throw new Error('n8n workflow must send canonical sourceType');
          }
          if (/change-this|ci-n8n-token/.test(serialized)) {
            throw new Error('n8n workflow contains a hard-coded token');
          }
          NODE
          sh -n scripts/arthur/connect-n8n-network.sh

      - name: Run Arthur tests
        run: npm run test:arthur

      - name: Apply Arthur Core migrations
        run: |
          psql "$ARTHUR_DATABASE_URL" -v ON_ERROR_STOP=1 -f data/arthur/migrations/001_core_profile_memory_audit.up.sql
          psql "$ARTHUR_DATABASE_URL" -v ON_ERROR_STOP=1 -f data/arthur/migrations/002_tasks_decisions_confirmations.up.sql

      - name: Runtime smoke check
        run: |
          node - <<'NODE'
          const { createArthurRuntime } = require('./agents/arthur-core/runtime/create-runtime');
          (async () => {
            const runtime = createArthurRuntime();
            try {
              if (!(await runtime.healthcheck())) throw new Error('Arthur runtime healthcheck failed');
            } finally {
              await runtime.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Executable server smoke check
        env:
          ARTHUR_HTTP_HOST: 127.0.0.1
          ARTHUR_HTTP_PORT: 18787
          ARTHUR_SHUTDOWN_TIMEOUT_MS: 5000
          ARTHUR_API_TOKEN: ci-api-token
        run: |
          bash -c 'cd agents/arthur-core && exec node runtime/start-server.js' > /tmp/arthur-core.log 2>&1 &
          ARTHUR_PID=$!
          trap 'kill -TERM "$ARTHUR_PID" 2>/dev/null || true; wait "$ARTHUR_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18787/health | grep -q '"ok":true'; then
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18787/v1/profiles/sergey)" = "401"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer ci-api-token' http://127.0.0.1:18787/v1/profiles/sergey)" = "404"
              kill -TERM "$ARTHUR_PID"
              wait "$ARTHUR_PID"
              trap - EXIT
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/arthur-core.log
          exit 1

      - name: Verify Arthur Core schema
        run: |
          psql "$ARTHUR_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.arthur_profiles') IS NULL THEN RAISE EXCEPTION 'arthur_profiles table is missing'; END IF;
            IF to_regclass('public.arthur_memory') IS NULL THEN RAISE EXCEPTION 'arthur_memory table is missing'; END IF;
            IF to_regclass('public.arthur_audit_events') IS NULL THEN RAISE EXCEPTION 'arthur_audit_events table is missing'; END IF;
            IF to_regclass('public.arthur_tasks') IS NULL THEN RAISE EXCEPTION 'arthur_tasks table is missing'; END IF;
            IF to_regclass('public.arthur_decisions') IS NULL THEN RAISE EXCEPTION 'arthur_decisions table is missing'; END IF;
            IF to_regclass('public.arthur_confirmations') IS NULL THEN RAISE EXCEPTION 'arthur_confirmations table is missing'; END IF;
          END
          $$;
          SQL

      - name: Roll back Arthur Core migrations
        run: |
          psql "$ARTHUR_DATABASE_URL" -v ON_ERROR_STOP=1 -f data/arthur/migrations/002_tasks_decisions_confirmations.down.sql
          psql "$ARTHUR_DATABASE_URL" -v ON_ERROR_STOP=1 -f data/arthur/migrations/001_core_profile_memory_audit.down.sql

      - name: Verify rollback
        run: |
          psql "$ARTHUR_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.arthur_profiles') IS NOT NULL
              OR to_regclass('public.arthur_memory') IS NOT NULL
              OR to_regclass('public.arthur_audit_events') IS NOT NULL
              OR to_regclass('public.arthur_tasks') IS NOT NULL
              OR to_regclass('public.arthur_decisions') IS NOT NULL
              OR to_regclass('public.arthur_confirmations') IS NOT NULL THEN
              RAISE EXCEPTION 'Arthur Core rollback left database objects behind';
            END IF;
          END
          $$;
          SQL

      - name: Docker Compose and n8n network smoke check
        env:
          ARTHUR_POSTGRES_PASSWORD: ci-arthur-password
          ARTHUR_API_TOKEN: ci-n8n-token
          ARTHUR_N8N_NETWORK: arthur_n8n_ci
          TELEGRAM_BOT_TOKEN: '123456:ci-placeholder-token'
          TELEGRAM_ALLOWED_USER_IDS: '111111'
          ARTHUR_OWNER_PROFILE_ID: sergey
        run: |
          COMPOSE="docker compose -f docker/arthur/compose.yml"
          trap '$COMPOSE down --volumes --remove-orphans || true' EXIT
          $COMPOSE config --quiet
          $COMPOSE build api
          $COMPOSE up --detach --wait
          docker network inspect arthur_n8n_ci >/dev/null
          test -z "$(docker inspect -f '{{range $p, $conf := .NetworkSettings.Ports}}{{if $conf}}{{$p}}{{end}}{{end}}' arthur-core-api-1)"
          docker run --rm -i --network arthur_n8n_ci node:22-alpine node - <<'NODE'
          const base = 'http://arthur-api:8787';
          const headers = { 'content-type': 'application/json', 'x-arthur-api-token': 'ci-n8n-token', 'x-arthur-actor-id': 'n8n' };
          (async () => {
            const health = await fetch(`${base}/health`);
            if (!health.ok) throw new Error('Arthur Core is not reachable from n8n network');
            const profile = await fetch(`${base}/v1/profiles`, {
              method: 'POST', headers,
              body: JSON.stringify({ id: 'sergey', name: 'Сергей', timezone: 'Europe/Paris', locale: 'ru-RU' })
            });
            if (profile.status !== 201) throw new Error(`Profile creation failed: ${profile.status} ${await profile.text()}`);
            const task = await fetch(`${base}/v1/tasks`, {
              method: 'POST', headers,
              body: JSON.stringify({ ownerId: 'sergey', domain: 'business', title: 'CI: задача из n8n', sourceType: 'n8n' })
            });
            const body = await task.json();
            if (task.status !== 201 || body.data?.title !== 'CI: задача из n8n') {
              throw new Error(`Task creation failed: ${task.status} ${JSON.stringify(body)}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          $COMPOSE down --volumes --remove-orphans
          trap - EXIT
