name: VOZDOOH Commerce CI

on:
  pull_request:
    paths:
      - 'apps/vozdooh-commerce/**'
      - '.github/workflows/vozdooh-commerce-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/vozdooh-commerce/**'
      - '.github/workflows/vozdooh-commerce-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vozdooh-commerce-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Unit tests, lint, typecheck (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vozdooh-commerce
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vozdooh-commerce/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
