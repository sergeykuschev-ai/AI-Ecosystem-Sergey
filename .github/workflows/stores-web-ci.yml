name: Stores Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/stores-web/**'
      - '.github/workflows/stores-web-ci.yml'
  pull_request:
    paths:
      - 'apps/stores-web/**'
      - '.github/workflows/stores-web-ci.yml'
  workflow_dispatch:

concurrency:
  group: stores-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/stores-web

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/stores-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (hermetic, mock content)
        env:
          CONTENT_SOURCE: mock
          NEXT_PUBLIC_SITE_URL: https://stores-ci.example
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

      - name: Secret scan
        run: |
          if git grep -nE -I \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'xox[baprs]-[A-Za-z0-9-]+' \
            -- .; then
            echo "::error::Potential secret detected in apps/stores-web"
            exit 1
          fi
