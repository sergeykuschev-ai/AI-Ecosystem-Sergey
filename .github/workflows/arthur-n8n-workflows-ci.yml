name: Arthur n8n Workflows CI

on:
  pull_request:
    paths:
      - 'n8n/workflows/**'
      - 'scripts/arthur/import-n8n-workflows.js'
      - 'scripts/arthur/*minmax-workflow.js'
      - 'scripts/arthur/minmax-n8n-workflow-deployment.js'
      - 'scripts/arthur/n8n-import.env.example'
      - 'agents/arthur-core/tests/minmax_n8n_deployment.test.js'
      - 'docs/purchasing-minmax-n8n-intake.md'
      - 'package.json'
      - 'docs/arthur/**'
      - '.github/workflows/arthur-n8n-workflows-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Fixed MinMax deployment contract
        run: node --test agents/arthur-core/tests/minmax_n8n_deployment.test.js

      - name: Validate Arthur production workflows
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const directory = 'n8n/workflows';
          const files = fs.readdirSync(directory).filter(name => name.endsWith('.json'));
          if (!files.length) throw new Error('No n8n workflow JSON files found');

          for (const file of files) {
            const fullPath = path.join(directory, file);
            const workflow = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            if (!workflow.name || !Array.isArray(workflow.nodes) || !workflow.nodes.length) {
              throw new Error(`${file}: invalid workflow structure`);
            }
            const serialized = JSON.stringify(workflow);
            if (/change-this|ci-n8n-token|bot\d+:[A-Za-z0-9_-]+/.test(serialized)) {
              throw new Error(`${file}: possible hard-coded secret`);
            }
            if (workflow.active !== false) {
              throw new Error(`${file}: imported workflow must be inactive by default`);
            }
          }

          const createTaskPath = path.join(directory, 'arthur-create-task-production.json');
          const createTask = JSON.parse(fs.readFileSync(createTaskPath, 'utf8'));
          const createTaskRequest = createTask.nodes.find(node => node.id === 'create-arthur-task');

          if (!createTaskRequest || createTaskRequest.type !== 'n8n-nodes-base.httpRequest') {
            throw new Error('Create-task must contain the Arthur Core HTTP request node');
          }
          if (createTaskRequest.parameters.url !== 'http://arthur-api:8787/v1/tasks') {
            throw new Error('Create-task must use the stable Arthur Core Docker network alias');
          }
          if (createTaskRequest.parameters.options?.timeout !== 10000) {
            throw new Error('Create-task must fail within 10 seconds when Arthur Core is unreachable');
          }
          if (createTaskRequest.parameters.authentication !== 'genericCredentialType') {
            throw new Error('Create-task must use an n8n credential for Arthur Core');
          }

          const morningPath = path.join(directory, 'arthur-morning-task-brief-production.json');
          const morning = JSON.parse(fs.readFileSync(morningPath, 'utf8'));
          if (morning.nodes.length !== 4) throw new Error('Morning brief must contain exactly four nodes');
          if (morning.settings?.timezone !== 'Europe/Paris') throw new Error('Morning brief timezone must be Europe/Paris');

          const schedule = morning.nodes.find(node => node.type === 'n8n-nodes-base.scheduleTrigger');
          const request = morning.nodes.find(node => node.type === 'n8n-nodes-base.httpRequest');
          const formatter = morning.nodes.find(node => node.type === 'n8n-nodes-base.code');
          const telegram = morning.nodes.find(node => node.type === 'n8n-nodes-base.telegram');

          if (!schedule || JSON.stringify(schedule.parameters).includes('0 8 * * *') === false) {
            throw new Error('Morning brief must run daily at 08:00');
          }
          if (!request || request.parameters.url !== 'http://arthur-api:8787/v1/tasks/brief') {
            throw new Error('Morning brief must use the internal Arthur Core brief endpoint');
          }
          if (request.parameters.authentication !== 'genericCredentialType') {
            throw new Error('Morning brief must use an n8n credential for Arthur Core');
          }
          if (!formatter || !formatter.parameters.jsCode.includes('overdue') || !formatter.parameters.jsCode.includes('waiting')) {
            throw new Error('Morning brief formatter is incomplete');
          }
          if (!telegram || telegram.parameters.chatId !== 'REPLACE_CHAT_ID') {
            throw new Error('Morning brief must not store a real Telegram chat ID');
          }
          if (!telegram.credentials?.telegramApi || telegram.credentials.telegramApi.id !== 'REPLACE_IN_N8N') {
            throw new Error('Morning brief must use a Telegram credential placeholder');
          }

          const minmaxPath = path.join(directory, 'arthur-minmax-yandex-mail-intake.json');
          const minmax = JSON.parse(fs.readFileSync(minmaxPath, 'utf8'));
          const minmaxSerialized = JSON.stringify(minmax);
          if (/x-api-key["']?\s*:\s*["'][A-Za-z0-9_-]{16,}/.test(minmaxSerialized)) {
            throw new Error('MinMax intake must not store an API token value');
          }
          const imap = minmax.nodes.find(node => node.type === 'n8n-nodes-base.emailReadImap');
          if (!imap || imap.credentials?.imap?.id !== 'REPLACE_IN_N8N') {
            throw new Error('MinMax intake must use an IMAP credential placeholder');
          }
          const upload = minmax.nodes.find(node => node.id === 'upload-excel');
          if (!upload || upload.parameters?.contentType !== 'multipart-form-data') {
            throw new Error('MinMax intake must upload the Excel via multipart form data');
          }
          if (!JSON.stringify(upload.parameters).includes('x-idempotency-key')) {
            throw new Error('MinMax intake must send the idempotency key header');
          }
          if (upload.credentials?.httpHeaderAuth?.id !== 'REPLACE_IN_N8N') {
            throw new Error('MinMax intake must use a Purchasing API credential placeholder');
          }
          for (const node of minmax.nodes.filter(item => item.type === 'n8n-nodes-base.emailSend')) {
            if (node.credentials?.smtp?.id !== 'REPLACE_IN_N8N') {
              throw new Error('MinMax intake must use an SMTP credential placeholder');
            }
          }
          const minmaxCode = minmax.nodes
            .filter(node => node.type === 'n8n-nodes-base.code')
            .map(node => node.parameters?.jsCode || '')
            .join('\n');
          if (!minmaxCode.includes('MINMAX_ALLOWED_SENDER') || !minmaxCode.includes('MINMAX_POLL_TIMEOUT_SECONDS')) {
            throw new Error('MinMax intake must read filtering and polling config from env');
          }
          NODE

      - name: Validate minimal create-task importer
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const http = require('node:http');
          const { spawn } = require('node:child_process');
          const { once } = require('node:events');

          let savedWorkflow = null;
          const calls = [];

          async function readBody(request) {
            const chunks = [];
            for await (const chunk of request) chunks.push(chunk);
            return chunks.length ? JSON.parse(Buffer.concat(chunks).toString('utf8')) : null;
          }

          function send(response, status, body) {
            response.writeHead(status, { 'content-type': 'application/json' });
            response.end(JSON.stringify(body));
          }

          const server = http.createServer(async (request, response) => {
            try {
              const url = new URL(request.url, 'http://127.0.0.1');
              const body = await readBody(request);
              calls.push({ method: request.method, path: url.pathname, body });

              if (request.method === 'GET' && url.pathname === '/api/v1/workflows') {
                return send(response, 200, { data: savedWorkflow ? [savedWorkflow] : [] });
              }
              if (request.method === 'POST' && url.pathname === '/api/v1/workflows') {
                savedWorkflow = { ...body, id: 'workflow-1', active: false };
                return send(response, 201, savedWorkflow);
              }
              if (request.method === 'PUT' && url.pathname === '/api/v1/workflows/workflow-1') {
                savedWorkflow = { ...body, id: 'workflow-1', active: savedWorkflow.active };
                return send(response, 200, savedWorkflow);
              }
              if (request.method === 'POST' && url.pathname === '/api/v1/workflows/workflow-1/deactivate') {
                savedWorkflow.active = false;
                return send(response, 200, savedWorkflow);
              }
              return send(response, 404, { message: 'not found' });
            } catch (error) {
              return send(response, 500, { message: error.message });
            }
          });

          function runImporter(baseUrl, workflow, extraEnv = {}) {
            const env = {
              ...process.env,
              N8N_BASE_URL: baseUrl,
              N8N_API_KEY: 'ci-api-key',
              N8N_ARTHUR_CREDENTIAL_ID: 'ci-arthur-credential',
              ARTHUR_N8N_WORKFLOW: workflow
            };
            delete env.N8N_TELEGRAM_CREDENTIAL_ID;
            delete env.N8N_TELEGRAM_CHAT_ID;
            Object.assign(env, extraEnv);

            return new Promise((resolve, reject) => {
              const child = spawn(process.execPath, ['scripts/arthur/import-n8n-workflows.js'], { env });
              let stdout = '';
              let stderr = '';
              child.stdout.on('data', chunk => { stdout += chunk; });
              child.stderr.on('data', chunk => { stderr += chunk; });
              child.on('error', reject);
              child.on('close', code => resolve({ code, stdout, stderr }));
            });
          }

          (async () => {
            server.listen(0, '127.0.0.1');
            await once(server, 'listening');
            const baseUrl = `http://127.0.0.1:${server.address().port}`;

            const created = await runImporter(baseUrl, 'arthur-create-task-production');
            assert.equal(created.code, 0, created.stderr);
            assert.deepEqual(JSON.parse(created.stdout).workflow, {
              id: 'workflow-1',
              name: 'Arthur — Создать задачу (production)',
              action: 'created',
              active: false
            });
            assert.equal(savedWorkflow.active, false);
            assert.equal(
              savedWorkflow.nodes.find(node => node.credentials?.httpHeaderAuth)
                .credentials.httpHeaderAuth.id,
              'ci-arthur-credential'
            );
            const createTaskRequest = savedWorkflow.nodes.find(node => node.id === 'create-arthur-task');
            assert.equal(createTaskRequest.parameters.url, 'http://arthur-api:8787/v1/tasks');
            assert.equal(createTaskRequest.parameters.options.timeout, 10000);

            savedWorkflow.active = true;
            const updated = await runImporter(baseUrl, 'arthur-create-task-production');
            assert.equal(updated.code, 0, updated.stderr);
            assert.equal(JSON.parse(updated.stdout).workflow.action, 'updated');
            assert.equal(savedWorkflow.active, false);
            assert.equal(calls.filter(call => call.method === 'POST' && call.path === '/api/v1/workflows').length, 1);
            assert.equal(calls.filter(call => call.method === 'PUT' && call.path === '/api/v1/workflows/workflow-1').length, 1);
            assert.equal(calls.filter(call => call.path.endsWith('/deactivate')).length, 1);

            const callsBeforeErrors = calls.length;
            const missingTelegram = await runImporter(baseUrl, 'arthur-morning-task-brief-production');
            assert.notEqual(missingTelegram.code, 0);
            assert.match(missingTelegram.stderr, /N8N_TELEGRAM_CREDENTIAL_ID is required/);

            const missingChatId = await runImporter(baseUrl, 'arthur-morning-task-brief-production', {
              N8N_TELEGRAM_CREDENTIAL_ID: 'ci-telegram-credential'
            });
            assert.notEqual(missingChatId.code, 0);
            assert.match(missingChatId.stderr, /N8N_TELEGRAM_CHAT_ID is required/);

            const unknown = await runImporter(baseUrl, 'unknown-workflow');
            assert.notEqual(unknown.code, 0);
            assert.match(unknown.stderr, /Unknown ARTHUR_N8N_WORKFLOW "unknown-workflow"/);
            assert.match(unknown.stderr, /arthur-create-task-production/);
            assert.equal(calls.length, callsBeforeErrors);

            server.close();
            await once(server, 'close');
          })().catch(error => {
            server.close();
            console.error(error);
            process.exitCode = 1;
          });
          NODE
